name: Deploy site

# Site = app/* at the root + data/*.json under data/ + mockup/ under mockup/,
# pushed to the gh-pages branch (Pages serves that branch).
# Data commits made by the pipeline use GITHUB_TOKEN and do not trigger push
# workflows, so pipeline.yml and retract.yml call this workflow directly.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "data/**"
      - "mockup/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Build and push gh-pages
        run: |
          git config user.name "orange-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SRC_SHA=$(git rev-parse --short HEAD)
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch -q origin gh-pages
            git worktree add -q --detach _site origin/gh-pages
          else
            git worktree add -q --detach _site
            git -C _site checkout -q --orphan gh-pages
          fi
          git -C _site rm -rqf --ignore-unmatch .
          cp -r app/. _site/
          rm -f _site/README.md
          mkdir -p _site/data _site/mockup
          for f in statements.json status.json globe.json pending.json; do
            if [ -f "data/$f" ]; then cp "data/$f" _site/data/; fi
          done
          cp -r mockup/. _site/mockup/
          touch _site/.nojekyll
          git -C _site add -A
          if git -C _site diff --cached --quiet; then
            echo "Site unchanged."
            exit 0
          fi
          git -C _site commit -q -m "Deploy ${SRC_SHA}"
          git -C _site push -q origin HEAD:gh-pages
