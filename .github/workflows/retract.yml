name: Retract statement

# Run from the GitHub app: Actions -> Retract statement -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Statement id (st_...)"
        required: true
        type: string
      reason:
        description: "Reason, shown in the app as «Відкликано: <reason>»"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: retract-${{ inputs.id }}
  cancel-in-progress: false

jobs:
  retract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      # Retried from fresh data if a pipeline run pushes in between.
      - name: Retract and commit
        env:
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'true' }}
          ID: ${{ inputs.id }}
          REASON: ${{ inputs.reason }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "orange-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            python -m pipeline.retract "$ID" --reason="$REASON" --data data
            git add -A data
            if git diff --cached --quiet; then
              echo "Already retracted / nothing to commit for ${ID}"
              echo "Already retracted / nothing to commit for ${ID}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git commit -q -m "data: retract ${ID} [skip ci]"
            if git push -q origin "HEAD:$BRANCH"; then
              echo "Retracted ${ID}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Could not push the retraction after 5 attempts"
          exit 1

  deploy:
    needs: retract
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write
