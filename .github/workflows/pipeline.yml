name: Pipeline

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# No overlapping pipeline runs. retract.yml uses its own group (a pending run in a shared
# group would be cancelled by the next scheduled run); if a retract lands first, this run's
# push is rejected and its results are dropped: the next run fetches them again.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline requirements
        run: pip install -r pipeline/requirements.txt

      - name: Cache Argos model (en->uk)
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
            ~/stanza_resources
          key: argos-en-uk-v1

      # Translation is optional: if this fails, quote_uk stays null and the run goes on.
      - name: Install Argos Translate + en->uk package
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install argostranslate
          python - <<'PY'
          import argostranslate.package as p
          from argostranslate import translate
          langs = {l.code for l in translate.get_installed_languages()}
          if not {"en", "uk"} <= langs:
              p.update_package_index()
              pkg = next(x for x in p.get_available_packages() if x.from_code == "en" and x.to_code == "uk")
              p.install_from_path(pkg.download())
          print("argos en->uk ready")
          PY

      - name: Run pipeline (live)
        env:
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'true' }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: python -m pipeline.run --live --out data

      # Commit only when something other than the run timestamps changed.
      - name: Commit data
        id: commit
        run: |
          git config user.name "orange-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet -I '"(generated_at|updated_at|now_washington|now_kyiv)":' -- data; then
            echo "No meaningful data change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "data: update [skip ci]"
          if ! git push origin "HEAD:${{ github.event.repository.default_branch }}"; then
            echo "::warning::Push rejected (data changed meanwhile, e.g. a retract). Results dropped; next run redoes them."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write
